[project]
name = "babydag"
version = "0.1.0"
description = "Tiny, zero-dependency experiment DAGs for multi-stage ML/RL pipelines."
readme = "README.md"
authors = [
    { name = "Abhishek Sriraman", email = "abhisheksriraman@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
